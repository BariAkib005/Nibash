server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: nibash

  config:
    # Loads backend/.env (gitignored) so `./mvnw spring-boot:run` picks up local credentials
    # without exporting anything. Optional — in production the values come from real env vars.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nibash}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USER:nibash}
    password: ${MYSQL_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; JPA only validates its mappings against it
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
      # Lazy associations load in batches of up to 50 ids per query instead of one query per row,
      # so a list of 20 invoices fetches its line items in one IN (...) query, not twenty (plan §9: no N+1).
      hibernate.default_batch_fetch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    # The API contract is snake_case (avatar_path, due_date, building_id, …).
    # Jackson 3 already writes java.time values as ISO-8601, so no serialization feature is needed.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      # An unreachable mail host must not stall the 08:00 reminder batch on every recipient.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

nibash:
  # Where people open the app — the base of the links in invitation and rental emails.
  app-url: ${NIBASH_APP_URL:http://127.0.0.1:5173}
  timezone: Asia/Dhaka
  media-dir: ${NIBASH_MEDIA_DIR:./media}
  jobs:
    # The 00:05 overdue sweep and the 08:00 invoice reminders (Asia/Dhaka).
    enabled: ${NIBASH_JOBS_ENABLED:true}
  mail:
    from: ${NIBASH_MAIL_FROM:no-reply@nibash.bd}
    # Mail is sent on its own thread pool: reminder batches go out concurrently, and request-time
    # emails are handed off after commit so no web request waits on SMTP.
    threads: ${NIBASH_MAIL_THREADS:4}
  devices:
    # The TCP gateway intercom panels, card readers and gate controllers connect to (see README,
    # "Door hardware"). One worker thread per connected panel.
    enabled: ${NIBASH_DEVICES_ENABLED:true}
    port: ${NIBASH_DEVICE_PORT:9500}
    workers: ${NIBASH_DEVICE_WORKERS:32}
    # A panel that sends nothing (not even PING) for this long is treated as disconnected.
    idle-timeout-seconds: ${NIBASH_DEVICE_IDLE_SECONDS:60}
    # When set, panels must send it in HELLO. When empty, a panel is trusted only from the IP address
    # it was registered with (or from this machine, for the simulator).
    secret: ${NIBASH_DEVICE_SECRET:}
  intercom:
    # When set, POST /api/intercom/webhook requires this value in the X-Intercom-Secret header.
    webhook-secret: ${NIBASH_INTERCOM_WEBHOOK_SECRET:}
  cors:
    # Vite dev server (spec §13.2). In production Nginx fronts everything, so this is unused.
    allowed-origins: ${NIBASH_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        # Only the liveness probe the containers need (GET /actuator/health); nothing else is exposed.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Email is optional and fails silently (spec §10); an absent SMTP server must not mark the
      # API unhealthy and get its container restarted.
      enabled: false

logging:
  level:
    org.springframework.web: INFO
    com.nibash: DEBUG
