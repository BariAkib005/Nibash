# Integration tests run against a separate schema (created by db/setup.sql) so they never touch
# your dev data. Override via env vars in CI.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_TEST_DATABASE:nibash_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USER:nibash}
    password: ${MYSQL_PASSWORD:nibash_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
      # Lets the dashboard test count the SQL statements one request issues (the no-N+1 check).
      hibernate.generate_statistics: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

nibash:
  timezone: Asia/Dhaka
  media-dir: ./build/test-media
  jobs:
    enabled: false        # the suite calls the jobs directly; never let the scheduler fire mid-run
  intercom:
    webhook-secret: ""
  cors:
    allowed-origins: http://127.0.0.1:5173
