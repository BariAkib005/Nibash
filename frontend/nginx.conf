# One origin for everything (spec §13.2): the built SPA, plus /api, /media and /ws proxied to the
# backend container. Because the browser only ever talks to this server, there is no CORS in
# production and the chat socket passes the backend's same-origin handshake check.

upstream nibash_backend {
    server backend:8000;
    keepalive 16;
}

# WebSocket upgrades need "Connection: upgrade"; plain requests keep the keep-alive default.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 10 MB by the API; leave headroom for the multipart envelope.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://nibash_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The backend sets nosniff and a sandboxing CSP on every upload. Declaring any add_header here
    # stops the server-level ones being inherited, so the backend's headers are not duplicated.
    location /media/ {
        proxy_pass http://nibash_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The chat socket: the Upgrade/Connection pair is what the plan calls "the usual culprit".
    # Host is forwarded unchanged so Spring's same-origin handshake check sees matching origins.
    location /ws/ {
        proxy_pass http://nibash_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build assets never change under the same name — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the app shell, never cached, so a deploy is
    # picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
