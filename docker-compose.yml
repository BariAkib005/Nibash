# Nibash — the full stack in containers (plan §Week 6): MySQL, the Spring Boot API, and Nginx serving
# the React build and proxying /api, /media and /ws.
#
#   cp .env.example .env        # then set the passwords
#   docker compose up -d --build
#   open http://localhost:8080  (HTTP_PORT in .env)
#
# Flyway builds the schema on the API's first boot. To load the demo fixture, set NIBASH_SEED=true in
# .env for one start (it is idempotent, so leaving it on is harmless — just slower to boot).

name: nibash

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nibash}
      MYSQL_USER: ${MYSQL_USER:-nibash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Modest buffer pool so MySQL and the JVM fit one small VM (plan §9).
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ defers expansion to the container, so the password never shows in `docker ps`.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nibash}
      MYSQL_USER: ${MYSQL_USER:-nibash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      NIBASH_MEDIA_DIR: /app/media
      NIBASH_SEED: ${NIBASH_SEED:-false}
      NIBASH_JOBS_ENABLED: ${NIBASH_JOBS_ENABLED:-true}
      NIBASH_INTERCOM_WEBHOOK_SECRET: ${NIBASH_INTERCOM_WEBHOOK_SECRET:-}
      NIBASH_MAIL_FROM: ${NIBASH_MAIL_FROM:-no-reply@nibash.bd}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_TLS: ${SMTP_TLS:-false}
      # Nginx serves one origin, so the dev-only CORS list is irrelevant here.
      NIBASH_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # The base of the links in invitation and rental emails.
      NIBASH_APP_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # Door hardware (TCP). Inside Docker every panel appears to come from the bridge address, so
      # the registered-IP check can't identify one: set a secret and give it to the panels.
      NIBASH_DEVICE_SECRET: ${NIBASH_DEVICE_SECRET:-}
    ports:
      # The device gateway panels connect to. Nginx serves the web app; this is plain TCP.
      - "${DEVICE_PORT:-9500}:9500"
    volumes:
      - media:/app/media
    healthcheck:
      # The JRE image has no curl; bash's /dev/tcp speaks just enough HTTP to read the health probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mysql-data:
  media:
